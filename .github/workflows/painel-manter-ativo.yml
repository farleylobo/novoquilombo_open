# O plano gratuito do Supabase pausa projetos sem uso por uma semana. Este fluxo chama rnq_ping a cada 3 dias
# para o painel admin não "dormir" quando ninguém entra. Opcional: só roda se os dois segredos existirem em
# GitHub > Settings > Secrets and variables > Actions (veja docs/PAINEL-ADMIN.md):
#   RNQ_SUPABASE_URL          https://<projeto>.supabase.co
#   RNQ_SUPABASE_CHAVE_PUBLICA a chave publicável (a mesma de admin/config.js; não é a secreta)
name: Painel admin — manter ativo
on:
  schedule:
    - cron: '17 11 */3 * *'
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rnq_ping
        env:
          URL: ${{ secrets.RNQ_SUPABASE_URL }}
          CHAVE: ${{ secrets.RNQ_SUPABASE_CHAVE_PUBLICA }}
        run: |
          if [ -z "$URL" ] || [ -z "$CHAVE" ]; then echo "Segredos não configurados: nada a fazer."; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/rnq_ping" -H "apikey: $CHAVE" -H "Content-Type: application/json" -d '{}'
